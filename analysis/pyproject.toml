# Sous-projet d'analyse de dérive (#17) : Evidently 0.7.23 ne s'importe pas avec pandas 3
# (incompatibilité non déclarée). Verrou séparé, pandas 2.3 ; l'API, l'image et le Space
# restent en pandas 3. Usage : uv run --project analysis <commande> (depuis la racine).
[project]
name = "credit-scoring-analysis"
version = "0.0.0"
description = "Analyse de dérive Evidently : job planifié et notebook (OC AI Engineer P8)"
requires-python = ">=3.12"
dependencies = [
    "credit-scoring",
    "evidently==0.7.23",
    "pandas>=2.2,<3",
    "pyarrow>=26.0.1",
    "huggingface-hub>=2.4.0",
    "matplotlib>=3.9",
    "jupyter>=1.1",
    "nbconvert>=7.16",
    "pytest>=8",
    "pytest-cov>=6",
]

[tool.uv]
package = false

[tool.uv.sources]
credit-scoring = { path = "..", editable = true }
