# Dependabot — PR groupées hebdomadaires, fusion automatique si les gates sont vertes.
---
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Paris"
    labels: ["type:chore", "dependencies"]
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
    groups:
      uv-minor-patch:
        update-types: ["minor", "patch"]

  # Sous-projet d'analyse de dérive (Evidently, pandas 2.3) : verrou séparé (#17).
  - package-ecosystem: "uv"
    directory: "/analysis"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Paris"
    labels: ["type:chore", "dependencies"]
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 3
    ignore:
      # Evidently 0.7.23 ne s'importe pas avec pandas 3 : pandas reste en 2.x ici.
      - dependency-name: "pandas"
        update-types: ["version-update:semver-major"]
    groups:
      analysis-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Paris"
    labels: ["type:chore", "dependencies"]
    commit-message:
      prefix: "chore(docker)"
    ignore:
      # Python suit .python-version (CI et image sur la même mineure) : pas de saut 3.12 → 3.x.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Paris"
    labels: ["type:chore", "dependencies"]
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns: ["*"]
