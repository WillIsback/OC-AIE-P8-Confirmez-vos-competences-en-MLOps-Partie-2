[project]
name = "credit-scoring"
dynamic = ["version"]
description = "Mise en production et monitoring du modèle de scoring crédit Home Credit (OC AI Engineer P8)"
readme = "README.md"
license = "MIT"
authors = [{ name = "William Derue" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "lightgbm>=4.7.0",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "uvicorn",
]

[dependency-groups]
dev = [
    "httpx2",
    "mypy",
    "pytest",
    "pytest-cov",
    "ruff",
    "types-pyyaml",
    "pyyaml",
    "huggingface-hub>=2.4.0",
    "pandas-stubs>=3.1.0.261029",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# Version dérivée du dernier tag git vX.Y.Z (posé par le workflow release).
# Dans l'image Docker, sans .git : SETUPTOOLS_SCM_PRETEND_VERSION.
[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/credit_scoring"]

[tool.uv]
# Réinstalle le paquet quand le commit ou les tags changent (version dynamique).
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "S", "N", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"scripts/export_p6_artifacts.py" = ["S301", "S608"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --cov=credit_scoring --cov-report=term-missing --cov-fail-under=80"
markers = [
    "integration: appelle un service réel (exclu de la CI de PR)",
]

[[tool.mypy.overrides]]
# Script d'export lancé dans l'environnement de P6 (cloudpickle n'est pas une dépendance de P8)
module = ["cloudpickle"]
ignore_missing_imports = true
